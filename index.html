<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0B0B">
  <meta name="description" content="Портфолио Елизаветы Цех: презентации, графический дизайн, продуктовые интерфейсы и интерактивные кейсы.">
  <link rel="canonical" href="https://lizatsekh.ru/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Елизавета Цех — портфолио дизайнера</title>
  <style>
    @font-face { font-family: "Tungsten"; src: url("/portfolio/fonts/Tungsten-Bold.woff2") format("woff2"); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0B0B0B; color: #F3F1EC; font-family: Arial, sans-serif; }
    main { min-height: 100vh; padding: clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; }
    .name { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    h1 { max-width: 900px; margin: 80px 0 48px; font: clamp(64px, 13vw, 180px)/.76 "Tungsten", Impact, sans-serif; letter-spacing: -.025em; text-transform: uppercase; }
    h1 span { color: #FFA41B; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 760px; }
    a { min-height: 152px; padding: 24px; border: 1px solid rgba(243, 241, 236, .22); border-radius: 20px; color: inherit; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; transition: background .2s, color .2s, border-color .2s; }
    a:hover, a:focus-visible { background: #FFA41B; border-color: #FFA41B; color: #0B0B0B; outline: none; }
    a strong { font-size: 28px; letter-spacing: -.04em; }
    a small { max-width: 220px; color: #AAA7A1; line-height: 1.35; }
    a:hover small, a:focus-visible small { color: inherit; }
    footer { margin-top: 48px; color: #8F8C86; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    @media (max-width: 600px) { h1 { margin: 64px 0 36px; } nav { grid-template-columns: 1fr; } a { min-height: 124px; } }
  </style>
</head>
<body>
  <main>
    <div class="name">Елизавета Цех</div>
    <section>
      <h1>Выберите<br><span>направление</span></h1>
      <nav aria-label="Разделы сайта">
        <a href="/portfolio/"><strong>Портфолио ↗</strong><small>Графический дизайн, визуальные истории и проекты.</small></a>
        <a href="/interfaces/"><strong>Интерфейсы ↗</strong><small>UI-дизайн, продуктовые сценарии и интерактивные кейсы.</small></a>
      </nav>
    </section>
    <footer>Портфолио дизайнера</footer>
  </main>
</body>
</html>
