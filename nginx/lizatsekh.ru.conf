# Install as /etc/nginx/sites-available/lizatsekh.ru, then enable it with a
# symlink from /etc/nginx/sites-enabled/. Paths below match REMOTE_DIR from
# deploy.sh; change them together if the deployment directory changes.

server {
    listen 80;
    listen [::]:80;
    server_name lizatsekh.ru;

    # Let Yandex verify the exact file over HTTP as well as HTTPS.
    location = /yandex_54ab1d330ea02f48.html {
        root /home/coftochka/liza-tsekh;
        try_files $uri =404;
    }

    # One shared favicon for the landing page and both site branches.
    location = /favicon.svg {
        alias /home/coftochka/liza-tsekh/portfolio/img/favicon.svg;
    }

    location / {
        return 301 https://lizatsekh.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lizatsekh.ru;

    ssl_certificate     /etc/letsencrypt/live/lizatsekh.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lizatsekh.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Do not alias a file directly to the slash URI: nginx treats that URI as
    # a directory and appends its index file. Keep the public URL at / and
    # internally route it to a file-only location instead.
    location = / {
        rewrite ^ /__landing-page.html last;
    }

    location = /__landing-page.html {
        internal;
        default_type text/html;
        alias /home/coftochka/liza-tsekh/index.html;
    }

    location = /yandex_54ab1d330ea02f48.html {
        root /home/coftochka/liza-tsekh;
        try_files $uri =404;
    }

    # One shared favicon for the landing page and both site branches.
    location = /favicon.svg {
        alias /home/coftochka/liza-tsekh/portfolio/img/favicon.svg;
    }

    location = /portfolio {
        return 301 /portfolio/;
    }

    location = /portfolio/ {
        # The exact index-file location below serves the response. Using
        # ``alias`` to a file here makes nginx 1.24 enter an internal redirect
        # loop for this slash-terminated URI.
        rewrite ^ /portfolio/index.html last;
    }

    location = /portfolio/index.html {
        alias /home/coftochka/liza-tsekh/portfolio/index.html;
    }

    location = /portfolio/support.js {
        alias /home/coftochka/liza-tsekh/portfolio/support.js;
    }

    location = /portfolio/stat-roll.js {
        alias /home/coftochka/liza-tsekh/portfolio/stat-roll.js;
    }

    location ^~ /portfolio/img/ {
        alias /home/coftochka/liza-tsekh/portfolio/img/;
        try_files $uri =404;
    }

    location ^~ /portfolio/fonts/ {
        alias /home/coftochka/liza-tsekh/portfolio/fonts/;
        try_files $uri =404;
    }

    # Keep the existing front-end beacon harmless after retiring server.py.
    location = /portfolio/__session {
        return 204;
    }

    location = /interfaces {
        return 301 /interfaces/;
    }

    # This is an internal rewrite: the browser keeps /interfaces/ in its
    # address bar while nginx serves interfaces/index.html.
    location = /interfaces/ {
        rewrite ^ /interfaces/index.html last;
    }

    # Exact public entry files, components and scripts. Do not expose draft
    # pages, the archive, README or the local launch script.
    location ~ ^/interfaces/(?<interfaces_file>(?:index|cover-demo-1|cover-demo-2)\.html|(?:CoverDemo1|CoverDemo2|NewCasesClean|NewCaseKvartal|NewCaseUchet|NewKvartalAdminPanel|NewUchetScreens)\.dc\.html|(?:support|case-reel|dash-reel|original-deck-reel|dashboard-motion)\.js)$ {
        alias /home/coftochka/liza-tsekh/interfaces/$interfaces_file;
    }

    # Only directories used by the published interface portfolio are exposed.
    # In particular, interfaces/src/ stays private.
    location ^~ /interfaces/assets/ {
        alias /home/coftochka/liza-tsekh/interfaces/assets/;
        try_files $uri =404;
    }

    location ^~ /interfaces/deck/ {
        alias /home/coftochka/liza-tsekh/interfaces/deck/;
        try_files $uri =404;
    }

    location ^~ /interfaces/hero-export/ {
        alias /home/coftochka/liza-tsekh/interfaces/hero-export/;
        try_files $uri =404;
    }

    location ^~ /interfaces/hero-slides/ {
        alias /home/coftochka/liza-tsekh/interfaces/hero-slides/;
        try_files $uri =404;
    }

    location ^~ /interfaces/img/ {
        alias /home/coftochka/liza-tsekh/interfaces/img/;
        try_files $uri =404;
    }

    # Do not fall back to a project-root static directory.
    location / {
        return 404;
    }
}
