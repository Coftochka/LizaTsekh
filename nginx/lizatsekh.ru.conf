# Install as /etc/nginx/sites-available/lizatsekh.ru, then enable it with a
# symlink from /etc/nginx/sites-enabled/. Paths below match REMOTE_DIR from
# deploy.sh; change them together if the deployment directory changes.

server {
    listen 80;
    listen [::]:80;
    server_name lizatsekh.ru;

    # Let Yandex verify the exact file over HTTP as well as HTTPS.
    location = /yandex_54ab1d330ea02f48.html {
        root /home/coftochka/liza-tsekh;
        try_files $uri =404;
    }

    location / {
        return 301 https://lizatsekh.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lizatsekh.ru;

    ssl_certificate     /etc/letsencrypt/live/lizatsekh.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lizatsekh.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The public entry point is the portfolio, not the project directory.
    location = / {
        return 301 /portfolio/;
    }

    location = /yandex_54ab1d330ea02f48.html {
        root /home/coftochka/liza-tsekh;
        try_files $uri =404;
    }

    location = /portfolio {
        return 301 /portfolio/;
    }

    location = /portfolio/ {
        # The exact index-file location below serves the response. Using
        # ``alias`` to a file here makes nginx 1.24 enter an internal redirect
        # loop for this slash-terminated URI.
        rewrite ^ /portfolio/index.html last;
    }

    location = /portfolio/index.html {
        alias /home/coftochka/liza-tsekh/index.html;
    }

    location = /portfolio/support.js {
        alias /home/coftochka/liza-tsekh/support.js;
    }

    location = /portfolio/stat-roll.js {
        alias /home/coftochka/liza-tsekh/stat-roll.js;
    }

    location ^~ /portfolio/img/ {
        alias /home/coftochka/liza-tsekh/img/;
        try_files $uri =404;
    }

    location ^~ /portfolio/fonts/ {
        alias /home/coftochka/liza-tsekh/fonts/;
        try_files $uri =404;
    }

    # Keep the existing front-end beacon harmless after retiring server.py.
    location = /portfolio/__session {
        return 204;
    }

    # Do not fall back to a project-root static directory.
    location / {
        return 404;
    }
}
