<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body>div{position:absolute;inset:0}case-reel,dash-reel{display:block;width:100%;height:100%}</style><script src="../case-reel.js"></script><case-reel scenario="rag" speed="2.6"></case-reel><script>const host=document.querySelector('case-reel');function fit(){if(!host.shadowRoot?.querySelector('.stage'))return;let st=host.shadowRoot.querySelector('style[data-hero]');if(!st){st=document.createElement('style');st.dataset.hero='';host.shadowRoot.append(st)}st.textContent='.screen{background:#10131c!important;color:#edf0f8!important}.head{background:#191e2b!important;border-color:#ffffff12!important}.m.bot{background:#242b3b!important;color:#edf0f8!important}.m .src,.m .ib span{background:#323c51!important;color:#c8d8ff!important}.field,.kbd span{background:#242b3b!important;color:#e4e9f4!important;border-color:#ffffff10!important}.sb i,.sb b:after{background:#e4e9f4!important}.sb b{border-color:#e4e9f4!important}.m .g,.head small,.ph{color:#a6b1c8!important}.screen{border-radius:35px!important}.m{transition-duration:.16s,.22s!important}.phone{left:0!important;top:0!important;transform:none!important;opacity:1!important;border:0!important;padding:0!important;box-shadow:none!important}.title,.features,.cards,.cursor,.glow{display:none!important}'+'.stage{width:322px!important;height:652px!important;transform-origin:0 0!important;transform:scale('+Math.min(innerWidth/322,innerHeight/652)+')!important}';}setInterval(fit,200);onresize=fit;</script><script>addEventListener("message",e=>{if(e.origin===location.origin&&typeof e.data?.heroPaused==="boolean"){host.visible=!e.data.heroPaused;}});</script>
