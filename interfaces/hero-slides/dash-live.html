<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body>div{position:absolute;inset:0}case-reel,dash-reel{display:block;width:100%;height:100%}</style><script src="dashboard-motion.js"></script><dash-reel scenario="dash" speed="2.4"></dash-reel><script>const host=document.querySelector('dash-reel');function fit(){if(!host.shadowRoot?.querySelector('.stage'))return;let st=host.shadowRoot.querySelector('style[data-hero]');if(!st){st=document.createElement('style');st.dataset.hero='';host.shadowRoot.append(st)}st.textContent='.win{left:0!important;top:0!important;transform:none!important;border-radius:0!important}.glow{display:none!important}.an{opacity:1!important;transform:none!important;filter:none!important}'+'.stage{width:1640px!important;height:1000px!important;transform-origin:0 0!important;transform:scale('+Math.min(innerWidth/1640,innerHeight/1000)+')!important}';}setInterval(fit,200);onresize=fit;</script><script>addEventListener("message",e=>{if(e.origin===location.origin&&typeof e.data?.heroPaused==="boolean"){host.visible=!e.data.heroPaused;}});</script>
