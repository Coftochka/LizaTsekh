<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Елизавета Цех — портфолио интерфейсов</title>
  <style>
    html, body, #interfaces-site { width: 100%; height: 100%; margin: 0; border: 0; background: #0B0B0B; }
    #interfaces-site { display: block; }
  </style>
</head>
<body>
  <iframe id="interfaces-site" title="Елизавета Цех — портфолио интерфейсов"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('interfaces-site');
      var query = window.matchMedia('(max-aspect-ratio: 1 / 1)');
      var source = '';

      function loadVersion() {
        var next = query.matches ? './mobile.html' : './desktop.html';
        if (next === source) return;
        source = next;
        frame.src = next + window.location.search + window.location.hash;
      }

      if (query.addEventListener) query.addEventListener('change', loadVersion);
      else query.addListener(loadVersion);
      loadVersion();
    }());
  </script>
</body>
</html>
