<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000;-webkit-font-smoothing:antialiased}.hero{position:relative;height:100vh;min-height:560px;overflow:hidden}</style>
</head>
<body>
<section class="hero">
<div id="hero-reel" style="position:absolute;inset:0;min-height:100%;overflow:hidden;background:#000;font-family:Manrope,sans-serif;color:#F3F1EC;pointer-events:none;user-select:none">

  <div data-s="B" style="display:none;position:absolute;inset:0;background:#E6E6E3"></div>
  <div data-s="E" style="display:none;position:absolute;inset:0;background:#F1F1EF"></div>
  <div data-s="F" style="display:none;position:absolute;inset:0;background:#E8E5DC"><div style="position:absolute;left:0;right:0;top:0;height:54%;background:#A4A4A0"></div></div>

  <div style="position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(.75);transform-origin:50% 50%" data-k="stage">

    <div data-s="B" style="display:none;position:absolute;inset:0;perspective:2200px;perspective-origin:960px 540px">
      <div data-k="planeB" style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d">
        <div style="position:absolute;left:-1300px;top:-620px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/kid-9.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-1300px;top:-175px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#F3F4F6;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="./img/kv-tickets.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-540px;top:-700px;width:410px;height:864px;transform:scale(.6);transform-origin:0 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.2))"><img src="./img/uc-overview.png" alt="" style="display:block;width:410px;height:864px"></div>
        <div style="position:absolute;left:-540px;top:-142px;width:410px;height:864px;transform:scale(.6);transform-origin:0 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.2))"><img src="./img/uc-calendar.png" alt="" style="display:block;width:410px;height:864px"></div>
        <div style="position:absolute;left:-254px;top:-880px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#F3F4F6;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="./img/kv-dashboard.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-254px;top:-435px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/deck0-11.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-254px;top:10px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/deck0-7.jpg?select=3" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:506px;top:-620px;width:410px;height:864px;transform:scale(.6);transform-origin:0 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.2))"><img src="./img/uc-category.png" alt="" style="display:block;width:410px;height:864px"></div>
        <div style="position:absolute;left:506px;top:-62px;width:410px;height:864px;transform:scale(.6);transform-origin:0 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.2))"><img src="./img/uc-add.png" alt="" style="display:block;width:410px;height:864px"></div>
        <div style="position:absolute;left:792px;top:-760px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/kid-8.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:792px;top:-315px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#F3F4F6;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="./img/kv-debtors.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>

<div style="position:absolute;left:-1300px;top:270px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/deck1-10.jpg?select=2" alt="Слайд презентации" style="width:100%;height:100%;object-fit:contain;display:block"></div>

<div style="position:absolute;left:792px;top:130px;width:720px;height:405px;border-radius:16px;overflow:hidden;background:#121212;box-shadow:0 30px 60px rgba(0,0,0,.18)"><img src="../hero-slides/deck0-3.jpg?select=2" alt="Слайд презентации" style="width:100%;height:100%;object-fit:contain;display:block"></div>

      </div>
    </div>

    <div data-s="D H" style="display:none;position:absolute;inset:0">
      <div data-k="ph0" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:205px 432px"><img src="./img/uc-overview.png" alt="" style="display:block;width:410px;height:864px"></div>
      <div data-k="ph1" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:205px 432px"><img src="./img/uc-category.png" alt="" style="display:block;width:410px;height:864px"></div>
      <div data-k="ph2" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:205px 432px"><img src="./img/uc-add.png" alt="" style="display:block;width:410px;height:864px"></div>
      <div data-k="ph3" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:205px 432px"><img src="./img/uc-calendar.png" alt="" style="display:block;width:410px;height:864px"></div>
      <div data-k="ph4" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:205px 432px"><img src="./img/uc-overview.png" alt="" style="display:block;width:410px;height:864px"></div>
    </div>

    <div data-s="E" style="display:none;position:absolute;inset:0;perspective:1800px;perspective-origin:960px 540px">
      <div data-k="planeE" style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d">
        <div style="position:absolute;left:-1520px;top:-560px;width:1440px;height:900px;border-radius:28px;overflow:hidden;background:#F3F4F6;box-shadow:0 50px 100px rgba(0,0,0,.16)"><img src="./img/kv-dashboard.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0"></div>
        <div style="position:absolute;left:0px;top:-380px;width:1440px;height:900px;border-radius:28px;overflow:hidden;background:#F3F4F6;box-shadow:0 50px 100px rgba(0,0,0,.16)"><img src="./img/kv-debtors.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0"></div>
      </div>
    </div>

    <div data-s="F" style="display:none;position:absolute;inset:0;overflow:hidden">
      <div data-k="titleF" style="position:absolute;left:0;right:0;top:40px;text-align:center;font-size:400px;font-weight:600;line-height:1;letter-spacing:-0.05em;color:#D6D6D2">Учёт</div>
      <div data-k="phF" style="position:absolute;left:0;top:0;width:410px;height:864px;transform-origin:0 0"><img src="./img/uc-overview.png" alt="" style="display:block;width:410px;height:864px"></div>
    </div>

    <div data-s="G" style="display:none;position:absolute;inset:0;perspective:1100px;perspective-origin:960px 540px">
      <div data-k="ringG" style="position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d">
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#121212;backface-visibility:hidden;transform:rotateX(-31.5deg) translateZ(-1000px)"><img src="../hero-slides/deck1-9.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#121212;backface-visibility:hidden;transform:rotateX(0deg) translateZ(-1000px)"><img src="../hero-slides/deck0-6.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#F3F4F6;backface-visibility:hidden;transform:rotateX(31.5deg) translateZ(-1000px)"><img src="./img/kv-tickets.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#121212;backface-visibility:hidden;transform:rotateX(63deg) translateZ(-1000px)"><img src="../hero-slides/kid-9.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#121212;backface-visibility:hidden;transform:rotateX(94.5deg) translateZ(-1000px)"><img src="../hero-slides/deck2-3.jpg?select=2" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#F3F4F6;backface-visibility:hidden;transform:rotateX(126deg) translateZ(-1000px)"><img src="./img/kv-dashboard.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
        <div style="position:absolute;left:-400px;top:-225px;width:800px;height:450px;border-radius:14px;overflow:hidden;background:#F3F4F6;backface-visibility:hidden;transform:rotateX(157.5deg) translateZ(-1000px)"><img src="./img/kv-debtors.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0"></div>
      </div>
    </div>
  </div>

  <div data-s="A" style="position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center">
    <div data-k="titleA" style="display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.4vw,32px);text-align:center">
      <img src="../img/photo-grey.jpg" alt="Елизавета Цех" style="display:block;width:clamp(148px,18vw,270px);height:clamp(148px,18vw,270px);border-radius:50%;object-fit:cover;object-position:50% 18%;box-shadow:0 22px 70px rgba(0,0,0,.45)">
      <div style="font-size:clamp(30px,4vw,64px);font-weight:300;line-height:1;letter-spacing:-.05em">Елизавета Цех</div>
    </div>
  </div>

  <div data-s="C" style="display:none;position:absolute;inset:0;z-index:2">
    <div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:.28em;font-size:clamp(24px,2.7vw,52px);letter-spacing:-0.03em;line-height:1.3;white-space:nowrap">
      <span data-k="fixedDesign" style="font-weight:300;flex:none">Дизайн</span>
      <span style="display:block;position:relative;width:12ch;height:1.3em;overflow:hidden;font-weight:700;flex:none">
        <span data-k="wordDrum" style="display:block;will-change:transform">
          <span style="display:block;height:1.3em;line-height:1.3">интерфейсов</span>
          <span style="display:block;height:1.3em;line-height:1.3">ботов</span>
          <span style="display:block;height:1.3em;line-height:1.3">дашбордов</span>
          <span style="display:block;height:1.3em;line-height:1.3">презентаций</span>
        </span>
      </span>
    </div>
  </div>

  <div data-s="G" style="display:none;position:absolute;inset:0;z-index:2">
  </div>

  <span data-k="clock" style="position:absolute;width:1px;height:1px;opacity:0"></span>
</div>
</section>
<script src="./hero-reel.js?v=kid-consumer"></script>
</body>
</html>
